title: 真航線 True Course
tagline: 航空新聞・飛行知識・機型解析
description: 真航線 True Course 是一個專注於航空的中文媒體，帶你把新聞看懂、把知識講清楚。
lang: zh-Hant

# ── 你自己的 METAR Cloudflare Worker（頂部即時天氣用）──
metar_worker: "https://metar.bill85412.workers.dev"

# ── baseurl 設定（很重要）──
url: "https://www.truecourse.tw"
baseurl: ""

# 文章集合：原始檔放在 _articles/<分類>/，網址自動變成 /<分類>/<檔名>/
collections:
  articles:
    output: true
    permalink: /:path/

defaults:
  - scope: { path: "", type: articles }
    values:
      layout: article

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - 如何新增文章.md
